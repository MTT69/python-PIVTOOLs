# This workflow builds and publishes the unified PIVTOOLs package to PyPI.
# It builds wheels for multiple platforms and uploads to PyPI on release.

name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build source distribution
        run: python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Activate MSVC on Windows
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          # Build for Python 3.11 and 3.12
          CIBW_BUILD: cp311-* cp312-*
          # Skip 32-bit builds, musl-based Linux, and other uncommon platforms
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          # Build only 64-bit architectures
          CIBW_ARCHS: "auto64"
          # Verbose output for debugging
          CIBW_BUILD_VERBOSITY: 1
          # Use manylinux2014 for broader compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          
          # Linux: Install FFTW development libraries
          CIBW_BEFORE_BUILD_LINUX: |
            yum install -y fftw-devel || (
              sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* &&
              sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-* &&
              yum install -y fftw-devel
            )
          
          # macOS: Install FFTW via Homebrew and use GCC
          CIBW_BEFORE_BUILD_MACOS: |
            brew install fftw gcc
          
          # Windows: Download FFTW, extract, and generate .lib file from .def
          CIBW_BEFORE_BUILD_WINDOWS: |
            curl -L -o C:\fftw.zip https://fftw.org/pub/fftw/fftw-3.3.10-dll64.zip || exit /b 1
            python -m zipfile -e C:\fftw.zip C:\ || exit /b 1
            if exist C:\fftw rmdir /s /q C:\fftw
            ren C:\fftw-3.3.10-dll64 fftw || exit /b 1
            echo Contents of C:\fftw:
            dir C:\fftw
            cd C:\fftw || exit /b 1
            echo Running lib.exe to generate .lib file...
            lib /def:libfftw3f-3.def /out:libfftw3f-3.lib /machine:x64 || exit /b 1
            echo Generated files:
            dir *.lib
            dir *.dll
            if not exist libfftw3f-3.lib (
              echo ERROR: libfftw3f-3.lib was not created!
              exit /b 1
            )
            echo SUCCESS: FFTW setup complete
          
          # Set environment variables for FFTW paths on Linux
          CIBW_ENVIRONMENT_LINUX: FFTW_INC_PATH=/usr/include FFTW_LIB_PATH=/usr/lib64
          
          # Set environment variables for FFTW paths and compiler on macOS
          # Set deployment target to 15.0 to match Homebrew builds
          CIBW_ENVIRONMENT_MACOS: >
            CC=/opt/homebrew/bin/gcc-14
            FFTW_INC_PATH=/opt/homebrew/include
            FFTW_LIB_PATH=/opt/homebrew/lib
            MACOSX_DEPLOYMENT_TARGET=15.0
          
          # Set environment variables for FFTW paths and compiler on Windows
          CIBW_ENVIRONMENT_WINDOWS: >
            FFTW_INC_PATH=C:\\fftw
            FFTW_LIB_PATH=C:\\fftw
            CC=cl
            CXX=cl
          
          # Repair wheels to bundle dependencies (important for shared libraries)
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\fftw -w {dest_dir} {wheel}"
          
          # Skip tests - just verify the wheel was built correctly
          # Testing with full dependencies can be done separately
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List distribution files
        run: ls -lhR dist

      - name: Verify distribution files
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true