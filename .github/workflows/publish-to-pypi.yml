name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Pinned (not macos-latest): the wheel's macOS floor is set by the
          # Homebrew libomp bottle that delocate bundles (minos == runner OS
          # major), so a floating runner would silently move the floor.
          - os: macos-15
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel wheel twine

      # Sets VSINSTALLDIR so setup.py resolves VS clang-cl (and stages the
      # libomp.dll that sits beside it).
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # setup.py hard-requires Homebrew LLVM clang on macOS (bundled OpenMP).
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm libomp
          "$(brew --prefix llvm)/bin/clang" --version

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          # The C libs are ctypes-loaded plain shared libraries (no Python.h),
          # so wheels are ABI-independent: build cp312 once per platform and
          # retag py3-none below.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # manylinux_2_28 (AlmaLinux 8): clang + libomp-devel are in AppStream;
          # manylinux2014 has no usable clang and setup.py requires one.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # mesa-libGL/glib2/libxcb are cv2 runtime deps needed by the smoke
          # test (opencv-python wheels don't bundle them).
          CIBW_BEFORE_ALL_LINUX: "dnf install -y clang libomp-devel mesa-libGL glib2 libxcb"
          # Portable arch flags — local dev builds stay `native`, wheels must
          # not bake the runner's CPU. x86 floor: AVX2+FMA (enforced at load
          # time by pivtools_cpu_supported); mac floor: any Apple Silicon.
          CIBW_ENVIRONMENT_LINUX: 'PIVTOOLS_WARP_MARCH="-mavx2 -mfma"'
          CIBW_ENVIRONMENT_MACOS: 'PIVTOOLS_FFT_MARCH="-mcpu=apple-m1" PIVTOOLS_WARP_MARCH="-mcpu=apple-m1"'
          CIBW_ENVIRONMENT_WINDOWS: 'PIVTOOLS_WARP_MARCH="/clang:-O3 /arch:AVX2"'
          # Floor set by the Homebrew libomp bottle delocate bundles (its
          # LC_BUILD_VERSION minos == 15.0), not by the toolchain.
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          # Real smoke: imports, ctypes loads of both shipped libs, ISA check,
          # Config fail-loud + init round-trip. Runs outside the project dir.
          CIBW_TEST_COMMAND: python "{project}/unit-tests/wheel_smoke.py"
          CIBW_BUILD_VERBOSITY: 1

      # No wheel content is Python-ABI-specific — serve every Python >=3.12
      # from one wheel per platform.
      - name: Retag wheels py3-none
        shell: bash
        run: |
          for whl in dist/*-cp312-cp312-*.whl; do
            python -m wheel tags --python-tag py3 --abi-tag none --remove "$whl"
          done
          ls -l dist/

      - name: Check metadata
        shell: bash
        run: python -m twine check dist/*.whl

      # The retagged py3-none wheel claims every Python >=3.12 but was built
      # and smoke-tested under 3.12 only — prove 3.13 and 3.14 too.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Smoke wheel on Python 3.13
        shell: bash
        run: |
          python -m venv smoke313
          if [ -d smoke313/bin ]; then PYBIN=smoke313/bin; else PYBIN=smoke313/Scripts; fi
          "$PYBIN/python" -m pip install --quiet dist/*.whl
          "$PYBIN/python" unit-tests/wheel_smoke.py

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Smoke wheel on Python 3.14
        shell: bash
        run: |
          python -m venv smoke314
          if [ -d smoke314/bin ]; then PYBIN=smoke314/bin; else PYBIN=smoke314/Scripts; fi
          "$PYBIN/python" -m pip install --quiet dist/*.whl
          "$PYBIN/python" unit-tests/wheel_smoke.py

      - name: Verify no build-host rpaths (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/wcheck && unzip -o dist/*.whl 'pivtools_cli/lib/*' -d /tmp/wcheck
          otool -L /tmp/wcheck/pivtools_cli/lib/*.so
          if otool -l /tmp/wcheck/pivtools_cli/lib/*.so | grep -q '/opt/homebrew'; then
            echo "ERROR: repaired wheel still references /opt/homebrew" && exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install build twine

      - run: python -m build --sdist --outdir dist

      - run: python -m twine check dist/*

      # Prove the sdist compiles from source in a clean env (this is what
      # "clone from GitHub / pip install pivtools --no-binary" users get).
      - name: Install sdist from source
        run: |
          sudo apt-get update && sudo apt-get install -y clang libomp-dev libgl1 libglib2.0-0 libxcb1
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          /tmp/sdist-venv/bin/python "$GITHUB_WORKSPACE/unit-tests/wheel_smoke.py"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{wheels-*,sdist}'
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: ls -R dist

      - run: python -m pip install twine

      - run: twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
