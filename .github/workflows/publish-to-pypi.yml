# This workflow builds and publishes the unified PIVTOOLs package to PyPI.
# It builds wheels for multiple platforms and uploads to PyPI on release.

name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build source distribution
        run: python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install FFTW with vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          vcpkg install fftw3:x64-windows
          echo FFTW installed to vcpkg directory
          dir C:\vcpkg\installed\x64-windows\include\fftw3*
          dir C:\vcpkg\installed\x64-windows\lib\fftw3*
          dir C:\vcpkg\installed\x64-windows\bin\fftw3*
          echo Setting up C:\fftw for compatibility
          mkdir C:\fftw
          copy C:\vcpkg\installed\x64-windows\include\*.h C:\fftw\
          copy C:\vcpkg\installed\x64-windows\lib\fftw3f.lib C:\fftw\libfftw3f-3.lib
          copy C:\vcpkg\installed\x64-windows\bin\fftw3f.dll C:\fftw\
          dir C:\fftw

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Install Windows repair tool
        if: runner.os == 'Windows'
        run: python -m pip install delvewheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_ARCHS: "auto64"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          
          CIBW_BEFORE_BUILD_LINUX: |
            yum install -y fftw-devel || (
              sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* &&
              sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-* &&
              yum install -y fftw-devel
            )
          
          CIBW_BEFORE_BUILD_MACOS: |
            brew install fftw gcc
          
          CIBW_ENVIRONMENT_LINUX: FFTW_INC_PATH=/usr/include FFTW_LIB_PATH=/usr/lib64
          
          CIBW_ENVIRONMENT_MACOS: CC=/opt/homebrew/bin/gcc-14 FFTW_INC_PATH=/opt/homebrew/include FFTW_LIB_PATH=/opt/homebrew/lib MACOSX_DEPLOYMENT_TARGET=15.0
          
          CIBW_ENVIRONMENT_WINDOWS: FFTW_INC_PATH=C:\\fftw FFTW_LIB_PATH=C:\\fftw CC=cl CXX=cl
          
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair --add-path C:\\fftw -w {dest_dir} {wheel}"
          
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List distribution files
        run: ls -lhR dist

      - name: Verify distribution files
        run: |
          python -m pip install --upgrade pip twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true