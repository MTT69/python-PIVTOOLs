# This workflow builds and publishes the unified PIVTOOLs package to PyPI.
# It runs on release and builds wheels for multiple platforms.

name: Build and publish PIVTOOLs to PyPI

# Run only when a new release is published on GitHub
on:
  release:
    types: [published]
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment: release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build core wheel (pure)
        run: python -m build --wheel --outdir dist pivtools_core

      - name: Build GUI wheel (pure)
        run: python -m build --wheel --outdir dist pivtools_gui

      - name: Upload pure wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-pure-wheels
          path: dist/*.whl

  build-c-wheels:
    name: Build C-extension wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Clean any pre-built artifacts
        run: |
          find . -name "*.so" -type f -delete
          find . -name "*.dylib" -type f -delete
          find . -name "*.dll" -type f -delete
          find . -type d -name "build" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build CLI wheels (with C extensions)
        run: |
          cd pivtools_cli
          python -m cibuildwheel --output-dir ../dist
        env:
          CIBW_BUILD: cp311-* cp312-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_ARCHS: "auto64"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD_LINUX: |
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* &&
            sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-* &&
            yum install -y fftw-devel
          CIBW_BEFORE_BUILD_MACOS: brew install fftw gcc && export CC=gcc-14
          CIBW_BEFORE_BUILD_WINDOWS: |
            curl -L -o fftw.zip https://fftw.org/pub/fftw/fftw-3.3.10-dll64.zip
            tar -xf fftw.zip -C C:\
          CIBW_ENVIRONMENT_LINUX: FFTW_INC_PATH=/usr/include FFTW_LIB_PATH=/usr/lib64
          CIBW_ENVIRONMENT_MACOS: FFTW_INC_PATH=/opt/homebrew/include FFTW_LIB_PATH=/opt/homebrew/lib CC=gcc-14
          CIBW_ENVIRONMENT_WINDOWS: FFTW_INC_PATH=C:\\fftw FFTW_LIB_PATH=C:\\fftw
          # Enable testing after first release - dependencies will be on PyPI
          # Uncomment the following lines after pivtools-core is published:
          # CIBW_BEFORE_TEST: pip install pivtools-core
          # CIBW_TEST_COMMAND: python -c "import pivtools_cli; print('Import successful')"
          CIBW_TEST_COMMAND: ""

      - name: Upload C-extension wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-c-wheels-${{ matrix.os }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build-sdists, build-pure-wheels, build-c-wheels]
    runs-on: ubuntu-latest
    # Ensure this only runs for the release event
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # This pattern will download all artifacts starting with 'dist-'
          # and merge them into the 'dist' directory.
          pattern: dist-*
          merge-multiple: true

      - name: List files for verification
        run: ls -lR dist

      - name: Check package contents
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Use an API token stored in GitHub secrets
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Publish all packages found in the 'dist' directory
          packages-dir: dist/
          skip-existing: true
          verbose: true