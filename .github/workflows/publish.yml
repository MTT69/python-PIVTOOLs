name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build cibuildwheel

    - name: Build core package (pure Python)
      run: |
        cd pivtools_core
        python -m build --wheel --outdir wheelhouse

    - name: Build CLI package wheels (with C extensions)
      run: |
        cd pivtools_cli
        python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
        CIBW_ARCHS: "auto64"
        CIBW_BEFORE_BUILD_LINUX: yum install -y fftw-devel
        CIBW_BEFORE_BUILD_MACOS: brew install fftw gcc && export CC=gcc-13
        CIBW_BEFORE_BUILD_WINDOWS: choco install fftw -y
        CIBW_ENVIRONMENT_LINUX: FFTW_INC_PATH=/usr/include FFTW_LIB_PATH=/usr/lib64
        CIBW_ENVIRONMENT_MACOS: FFTW_INC_PATH=/opt/homebrew/include FFTW_LIB_PATH=/opt/homebrew/lib CC=gcc-13
        CIBW_ENVIRONMENT_WINDOWS: FFTW_INC_PATH=C:\ProgramData\chocolatey\lib\fftw\include FFTW_LIB_PATH=C:\ProgramData\chocolatey\lib\fftw\lib
        CIBW_TEST_COMMAND: python -c "import pivtools_cli; print('CLI import successful')"

    - name: Build GUI package (pure Python)
      run: |
        cd pivtools_gui
        python -m build --wheel --outdir wheelhouse

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: |
          pivtools_core/wheelhouse/*.whl
          pivtools_cli/wheelhouse/*.whl
          pivtools_gui/wheelhouse/*.whl

  build-sdist:
    name: Build source distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build core sdist
      run: |
        cd pivtools_core
        python -m build --sdist --outdir dist

    - name: Build CLI sdist
      run: |
        cd pivtools_cli
        python -m build --sdist --outdir dist

    - name: Build GUI sdist
      run: |
        cd pivtools_gui
        python -m build --sdist --outdir dist

    - name: Upload sdists
      uses: actions/upload-artifact@v4
      with:
        name: sdists
        path: |
          pivtools_core/dist/*.tar.gz
          pivtools_cli/dist/*.tar.gz
          pivtools_gui/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Publish core to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/sdists/
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish CLI to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/sdists/
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish GUI to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/sdists/
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true

    - name: Publish wheels to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/wheels-*/
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true