name: Build and publish PIVTOOLs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: python -m pip install build cibuildwheel==2.16.2

    - name: Build core package wheel (pure Python)
      run: |
        cd pivtools_core
        python -m build --wheel --outdir wheelhouse

    - name: Build CLI wheels (with C extensions)
      run: |
        cd pivtools_cli
        python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
        CIBW_ARCHS: "auto64"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
        CIBW_BEFORE_BUILD_LINUX: |
          sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* &&
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-* &&
          yum install -y fftw-devel
        CIBW_BEFORE_BUILD_MACOS: brew install fftw gcc && export CC=gcc-13
        CIBW_BEFORE_BUILD_WINDOWS: |
          curl -L -o fftw.zip https://fftw.org/pub/fftw/fftw-3.3.10-dll64.zip
          unzip fftw.zip -d C:\fftw
          dir C:\fftw
          lib /def:C:\fftw\libfftw3-3.def /out:C:\fftw\libfftw3-3.lib /machine:x64
          dir C:\fftw
        CIBW_ENVIRONMENT_LINUX: FFTW_INC_PATH=/usr/include FFTW_LIB_PATH=/usr/lib64
        CIBW_ENVIRONMENT_MACOS: FFTW_INC_PATH=/opt/homebrew/include FFTW_LIB_PATH=/opt/homebrew/lib CC=gcc-13
        CIBW_ENVIRONMENT_WINDOWS: FFTW_INC_PATH=C:\fftw FFTW_LIB_PATH=C:\fftw
        CIBW_TEST_COMMAND: python -c "import pivtools_cli; print('CLI import successful')"

    - name: Build GUI package wheel (pure Python)
      run: |
        cd pivtools_gui
        python -m build --wheel --outdir wheelhouse

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: |
          pivtools_core/wheelhouse/*.whl
          pivtools_cli/wheelhouse/*.whl
          pivtools_gui/wheelhouse/*.whl

  build_sdist:
    name: Build source distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install build dependencies
      run: python -m pip install build

    - name: Build core sdist
      run: |
        cd pivtools_core
        python -m build --sdist --outdir dist

    - name: Build CLI sdist
      run: |
        cd pivtools_cli
        python -m build --sdist --outdir dist

    - name: Build GUI sdist
      run: |
        cd pivtools_gui
        python -m build --sdist --outdir dist

    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: |
          pivtools_core/dist/*.tar.gz
          pivtools_cli/dist/*.tar.gz
          pivtools_gui/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: '*'
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true