paths:
  base_paths:
    - '/Users/morgan/Library/CloudStorage/OneDrive-UniversityofSouthampton/Documents/#current_processing/query_JHTDB/Planar_Images_with_wall/test'
    # - "/another/base/path"
  source_paths:
    - '/Users/morgan/Library/CloudStorage/OneDrive-UniversityofSouthampton/Documents/#current_processing/query_JHTDB/Planar_Images_with_wall'
    # - "/another/source/path"
  camera_numbers: [1]  # e.g. [1,2,3]

images:
  num_images: 1000
  image_format:
    - "B%05d_A.tif"
    - "B%05d_B.tif"
  vector_format:
    - "%05d.mat"
  shape: [1024,1024]
  time_resolved: false  # Set to true for time-resolved PIV

batches:
  size: 50

processing:
  instantaneous: true
  ensemble: false
  stereo: false


plots:
  save_extension: ".png"
  save_pickle: true                
  fontsize: 14
  title_fontsize: 16

videos:
  - type: instantaneous
    endpoint: ''
    use_merged: false
    video_length: 100
    variable: 'ux'
  - type: instantaneous
    endpoint: ''
    use_merged: false
    video_length: 100
    variable: 'uy'

statistics_extraction:
  - type: instantaneous
    endpoint: ''
    use_merged: false
  # - type: another_type
  #   endpoint: '/some/endpoint'
  #   use_merged: true

instantaneous_piv:
  window_size:
    - [128, 128]
    - [64, 64]
    - [32, 32]
    - [16, 16]
    - [16, 16]
    - [16, 16]
  overlap: [50, 50, 50, 50, 50, 50]
  runs: [6]

ensemble_piv:
  runs: [5]

filters:
