paths:
  base_paths:
  - /Users/morgan/Library/CloudStorage/OneDrive-UniversityofSouthampton/Documents/#current_processing/query_JHTDB/Planar_Images_with_wall/test_images
  source_paths:
  - /Users/morgan/Library/CloudStorage/OneDrive-UniversityofSouthampton/Documents/#current_processing/query_JHTDB/Planar_Images_with_wall/test_images
  camera_numbers:
  - 1
images:
  num_images: 30
  image_format:
  - B%05d_A.tif
  - B%05d_B.tif
  vector_format:
  - '%05d.mat'
  shape:
  - 1152 # height
  - 1024 # width
  time_resolved: false
  dtype: uint8
batches:
  size: 20
logging:
  file: pypiv.log
  level: INFO
  console: true
processing:
  instantaneous: true
  ensemble: false
  stereo: false
  backend: cpu
  debug: false
  omp_threads: 2
  dask_workers_per_node: 5
  dask_threads_per_worker: 1
  dask_memory_limit: 5GB
post_processing:
- type: POD
  settings:
    k_modes: 1
    randomised: false
    stack_u_y: true
    normalise: false
    camera: 1
plots:
  save_extension: .png
  save_pickle: true
  fontsize: 14
  title_fontsize: 16
videos:
- endpoint: ''
  type: instantaneous
  use_merged: false
  variable: ux
  video_length: 100
- endpoint: ''
  type: gamma1
  use_merged: false
  variable: gamma1
  video_length: 100
statistics_extraction: null
instantaneous_piv:
  window_size:
  - - 128
    - 128
  - - 64
    - 64
  - - 32
    - 32
  - - 16
    - 16
  - - 16
    - 16
  - - 16
    - 16
  overlap:
  - 50
  - 50
  - 50
  - 50
  - 50
  - 50
  
  runs:
  - 6
  time_resolved: false
  window_type: gaussian
  num_peaks: 1
  peak_finder: gauss3
  secondary_peak: false
ensemble_piv:
  runs:
  - 5
  filters:
  - type: time
  batch_size: 50
calibration_format:
  image_format: calib%05d.tif
calibration:
  active: stereo
  scale_factor:
    dt: 1
    px_per_mm: 3.41
    x_offset:
    - 0
    y_offset:
    - 0
  pinhole:
    source_path_idx: 1
    camera: 1
    image_index: 0
    file_pattern: calib%05d.tif
    pattern_cols: 10
    pattern_rows: 10
    dot_spacing_mm: 28.89
    enhance_dots: true
    asymmetric: false
    dot_distance_mm: 28.9
    grid_tolerance: 0.5
    ransac_threshold: 3
    dt: 1
  stereo:
    source_path_idx: 0
    camera_pair:
    - 1
    - 2
    file_pattern: planar_calibration_plate_*.tif
    pattern_cols: 10
    pattern_rows: 10
    dot_spacing_mm: 28.89
    enhance_dots: true
    asymmetric: false
    dt: 2
  image_format: calib%05d.tiff
filters: []
masking:
  enabled: true
  mask_file_pattern: mask_Cam%d.mat
  # Threshold for determining masked vectors based on overlap with pixel mask
  # 0.0 = mask if any pixel is masked, 0.5 = mask if >50% masked, 1.0 = mask only if fully masked
  mask_threshold: 0.01
  # Mask mode: 'file' to load from .mat file, 'rectangular' for edge masking
  mode: rectangular
  # Rectangular edge masking settings (used when mode: rectangular)
  # Specify number of pixels to mask from each edge
  rectangular:
    top: 64      # pixels from top edge
    bottom: 64   # pixels from bottom edge
    left: 0      # pixels from left edge
    right: 0     # pixels from right edge
  
  # Threshold for determining masked vectors based on overlap with pixel mask
