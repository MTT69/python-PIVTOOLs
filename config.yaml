paths:
  base_paths:
  - E:\Results\planar_no_noise
  source_paths:
  - E:\Synthetic\Planar_no_noise
  active_paths:
  - 0
  camera_numbers:
  - 1
  camera_count: 1
  camera_subfolders: []
images:
  image_format:
  - B%05d_A.tif
  - B%05d_B.tif
  vector_format:
  - '%05d.mat'
  dtype: float32
  image_type: standard
  use_camera_subfolders: false
  start_index: 1
  frame_stride: 0
  pair_stride: 1
  pairing_preset: ab_format
  num_loops: 1
  num_images: 4000
  image_shape:
  - 2048
  - 2048
batches:
  size: 5
logging:
  file: pypiv.log
  level: INFO
  console: true
processing:
  backend: cpu
  debug: false
  auto_compute_params: false
  omp_threads: 4
  dask_workers_per_node: 5
  dask_memory_limit: 10GB
  dask_max_in_flight_per_worker: 2
  open_dashboard: false
  dask_nanny: false
  post_processing_workers: 16
  always_batch: true
  instantaneous: true
  ensemble: false
outlier_detection:
  enabled: true
  methods:
  - threshold: 0.25
    type: peak_mag
  - type: median_2d
    epsilon: 0.1
    threshold: 3
infilling:
  mid_pass:
    method: nearest
    parameters: {}
  final_pass:
    enabled: true
    method: biharmonic
    parameters: {}
ensemble_outlier_detection:
  enabled: true
  methods: []
ensemble_infilling:
  mid_pass:
    method: biharmonic
    parameters: {}
  final_pass:
    enabled: true
    method: biharmonic
    parameters: {}
plots:
  save_extension: .png
  save_pickle: true
  fontsize: 14
  title_fontsize: 16
video:
  base_path_idx: 0
  camera: 1
  data_source: stereo
  variable: mag
  run: 3
  piv_type: instantaneous
  cmap: default
  lower: ''
  upper: ''
  fps: 30
  crf: 15
  resolution: 4k
  source_endpoint: regular
statistics:
  enabled_methods:
    mean_vorticity: false
    mean_stresses: true
    divergence: false
    mean_tke: false
    gamma2: false
    inst_vorticity: false
    inst_divergence: false
    mean_velocity: true
    inst_stresses: false
    inst_velocity: false
    gamma1: false
    mean_divergence: false
    tke: false
    correlation_quality: true
    fluctuating_velocity: false
    inst_gamma: false
    vorticity: false
  gamma_radius: 4
  save_figures: true
  type_name: instantaneous
  source_endpoint: regular
instantaneous_piv:
  window_size:
  - - 64
    - 64
  - - 32
    - 32
  - - 16
    - 16
  overlap:
  - 50
  - 50
  - 50
  runs:
  - 1
  - 3
  time_resolved: false
  window_type: gaussian
  num_peaks: 1
  peak_finder: gauss6
  secondary_peak: false
  predictor_smoothing: false
  save_mode: full
  save_compression: false
  image_warp_interpolation: lanczos
  dump_correlation_planes: false
ensemble_piv:
  fit_method: kspace
  kspace_shape: gaussian
  kspace_floor: coloured
  skip_background_subtraction: false
