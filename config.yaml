paths:
  base_paths:
  - D:\Processed_Wake_PIV\Case_A_Phase_003_Run_1
  - D:\Processed_Wake_PIV\Case_A_Phase_048_Run_1
  - D:\Processed_Wake_PIV\Case_A_Phase_093_Run_1
  - D:\Processed_Wake_PIV\Case_A_Phase_138_Run_1
  - D:\Processed_Wake_PIV\Case_B_Phase_003_Run_1
  - D:\Processed_Wake_PIV\Case_B_Phase_048_Run_1
  - D:\Processed_Wake_PIV\Case_B_Phase_093_Run_1
  - D:\Processed_Wake_PIV\Case_B_Phase_138_Run_1
  - D:\Processed_Wake_PIV\Case_C_Phase_003_Run_1
  - D:\Processed_Wake_PIV\Case_C_Phase_048_Run_1
  - D:\Processed_Wake_PIV\Case_C_Phase_093_Run_1
  - D:\Processed_Wake_PIV\Case_C_Phase_138_Run_1
  - D:\Processed_Wake_PIV\Case_D_Phase_003_Run_1
  - D:\Processed_Wake_PIV\Case_D_Phase_048_Run_1
  - D:\Processed_Wake_PIV\Case_D_Phase_093_Run_1
  - D:\Processed_Wake_PIV\Case_D_Phase_138_Run_1
  - D:\Processed_Wake_PIV\Case_E_Phase_003_Run_1
  - D:\Processed_Wake_PIV\Case_E_Phase_048_Run_1
  - D:\Processed_Wake_PIV\Case_E_Phase_093_Run_1
  - D:\Processed_Wake_PIV\Case_E_Phase_138_Run_1

  source_paths:
  - D:\Wake_PIV_16_8
  camera_numbers:
  - 1
  - 2
  camera_count: 2
  camera_subfolders: []
images:
  num_images: 1200
  image_format:
  - Grid_Case_A_Run_2.set
  vector_format:
  - '%05d.mat'
  time_resolved: false
  dtype: float32
  zero_based_indexing: false
batches:
  size: 50
logging:
  file: pypiv.log
  level: INFO
  console: true
processing:
  instantaneous: false
  ensemble: true
  backend: cpu
  debug: false
  auto_compute_params: false
  omp_threads: 2
  dask_workers_per_node: 4
  dask_threads_per_worker: 1
  dask_memory_limit: 25GB
outlier_detection:
  enabled: true
  methods:
  - threshold: 0.2
    type: peak_mag
  - epsilon: 0.2
    threshold: 2
    type: median_2d
infilling:
  mid_pass:
    method: biharmonic
    parameters:
      ksize: 3
  final_pass:
    enabled: true
    method: biharmonic
    parameters:
      ksize: 3
ensemble_outlier_detection:
  enabled: true
  methods:
  - epsilon: 0.2
    threshold: 2
    type: median_2d
ensemble_infilling:
  mid_pass:
    method: biharmonic
    parameters:
      ksize: 3
  final_pass:
    enabled: true
    method: biharmonic
    parameters:
      ksize: 3
plots:
  save_extension: .png
  save_pickle: true
  fontsize: 14
  title_fontsize: 16
videos:
- endpoint: ''
  type: instantaneous
  use_merged: false
  variable: ux
  video_length: 100
statistics_extraction: null
instantaneous_piv:
  window_size:
  - - 128
    - 128
  - - 64
    - 64
  - - 32
    - 32
  - - 16
    - 16
  overlap:
  - 50
  - 50
  - 50
  - 50
  runs:
  - 4
  time_resolved: false
  window_type: gaussian
  num_peaks: 1
  peak_finder: gauss3
  secondary_peak: false
ensemble_piv:
  window_size:
  - - 128
    - 128
  - - 64
    - 64
  - - 16
    - 16
  overlap:
  - 50
  - 50
  - 50
  type:
  - std
  - std
  - std
  runs:
  - 3
  store_planes: false
  save_diagnostics: false
  sum_window:
  - 16
  - 16
  resume_from_pass: 0
calibration_format:
  image_format: calib%05d.tif
calibration:
  active: pinhole
  scale_factor:
    dt: 0.56
    px_per_mm: 3.41
    source_path_idx: 0
  pinhole:
    source_path_idx: 0
    camera: 1
    image_index: 0
    file_pattern: calib00001.tif
    pattern_cols: 10
    pattern_rows: 10
    dot_spacing_mm: 28.89
    enhance_dots: true
    asymmetric: false
    dot_distance_mm: 28.9
    grid_tolerance: 0.5
    ransac_threshold: 3
    dt: 0.0275
  stereo:
    source_path_idx: 0
    camera_pair:
    - 1
    - 2
    file_pattern: planar_calibration_plate_*.tif
    pattern_cols: 10
    pattern_rows: 10
    dot_spacing_mm: 28.89
    enhance_dots: true
    asymmetric: false
    dt: 2
filters:
- type: pod
masking:
  enabled: true
  mask_file_pattern: mask_Cam%d.mat
  mask_threshold: 0.01
  mode: file
  rectangular:
    top: 64
    bottom: 64
    left: 0
    right: 0
