paths:
  base_path: "pypivtools/tests/data/instantaneous_piv/"
  camera_folders:
    - "Cam1"

processing:
  backend: "cpu"
  debug: False
  omp_threads: 48
  dask_workers_per_node: 1
  dask_threads_per_worker: 1
  dask_memory_limit: "20GB"

images:
  num_images: 1
  image_format: "B%05d_A.tif"
  shape: [1024,1024]

piv:
  type: "instantaneous"
  chunk_size: 1
  window_type: "gaussian"
  window_size:
  - [64,64]
  - [64,64]
  overlap:
    - 50
    - 50
  num_peaks: 3
  dt: 1
  peak_finder: "gauss6"
  secondary_peak: True
  epsilon:
  epsilon_threshold: 



preprocessing:
  filters:
    - type: "clip"
      threshold: [0, 255]
      n: 2.0
    - type: "invert"
      offset: 255
    - type: "time"
