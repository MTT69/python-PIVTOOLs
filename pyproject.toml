[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pivtools"
version = "0.6.0"
description = "PIVTOOLs - Particle Image Velocimetry Tools with CLI and GUI"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [
    {name = "Morgan Taylor", email = "m.t.taylor@soton.ac.uk"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Framework :: Flask",
]

dependencies = [
    # Core dependencies (floors = versions validated in development)
    "dask[distributed]>=2025.7.0",
    "dask-jobqueue",
    "dask-image",
    "loguru>=0.7.3",
    "numpy>=2.2",
    "opencv-python>=4.12",
    "pandas>=2.3",
    "pillow>=11.3",
    "PyYAML>=6.0",
    "scipy>=1.16",
    "tifffile>=2025.6.11",
    "tqdm>=4.67",
    # CLI dependencies
    "numba>=0.61",
    "psutil>=6.1",
    "rawpy>=0.25",
    "scikit-image>=0.25",
    "bottleneck>=1.6",
    "scikit-learn>=1.7",
    "threadpoolctl>=3.6",
    # GUI dependencies
    "Flask>=3.1",
    "flask-cors>=6.0",
    "flask-compress>=1.15",
    "matplotlib>=3.10",
    "imagecodecs",
    "imageio-ffmpeg>=0.5.0",
    "bokeh",
]

[project.optional-dependencies]
cine = ["cinereader"]
dev = ["pytest>=8.4"]

[project.urls]
Homepage = "https://github.com/MTT69/python-PIVTOOLs"
Repository = "https://github.com/MTT69/python-PIVTOOLs"
Issues = "https://github.com/MTT69/python-PIVTOOLs/issues"

[project.scripts]
pivtools-cli = "pivtools_cli.cli:main"
pivtools-gui = "pivtools_gui.app:main"
pivtools-bench = "pivtools_cli.bench.bench:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pivtools_core*", "pivtools_cli*", "pivtools_gui*"]
exclude = ["tests*", "manual_tools*", "logs*", "env*"]

[tool.setuptools.package-data]
"pivtools_cli" = [
    "lib/peak_locate_lm.c",
    "lib/peak_locate_lm.h",
    "lib/PIV_2d_cross_correlate.c",
    "lib/PIV_2d_cross_correlate.h",
    "lib/xcorr.c",
    "lib/xcorr.h",
    "lib/common.h",
    "lib/fused_warp.c",
    "lib/fused_warp.h",
    "lib/kspace_lm_fit.c",
    "lib/kspace_lm_fit.h",
    "lib/libbulkxcorr2d.*",
    "lib/libfusedwarp.*",
    "lib/libkspacefit.*",
    "lib/*.dll"
]
pivtools_gui = ["static/**/*", "templates/**/*"]
